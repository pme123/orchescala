name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Coursier Cache
        uses: coursier/cache-action@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the DMN Tester UI
        # sbt links the Scala.js output to 04-dmntester-client/target/scalajs,
        # vite bundles it to 04-dmntester-client/dist/webapp - from where it is
        # packaged into orchescala-dmntester-server
        run: |
          sbt dmnTesterClient/fullLinkJS
          npm --prefix 04-dmntester-client ci
          npm --prefix 04-dmntester-client run build
      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
