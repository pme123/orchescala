name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Coursier Cache
        uses: coursier/cache-action@v6
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the DMN Tester UI
        # links the Scala.js output and lets vite bundle it to
        # 04-dmntester-client/dist/webapp - from where it is packaged into
        # orchescala-dmntester-server. Packaging/publishing does this by itself
        # (see build.sbt: bundleClient) - here it is an own step, so a broken UI
        # build is easy to spot.
        run: sbt dmnTesterClient/bundleClient
      - name: Build the documentation apps
        run: sbt orchDocClient/bundleDocClient
      - name: Publish
        # --server: sbt in its own JVM with this step's environment. Without it, the sbt 2 client
        # hands ci-release to the server the steps above started - without the secrets, and
        # ci-release then says "No access to secret variables, doing nothing" and publishes nothing,
        # with exit code 0. So the step checks the secrets first and fails on that message.
        run: |
          set -o pipefail
          for v in PGP_SECRET PGP_PASSPHRASE SONATYPE_USERNAME SONATYPE_PASSWORD; do
            test -n "${!v}" || { echo "::error::$v is empty - the secret is not set"; exit 1; }
          done
          sbt --server ci-release 2>&1 | tee "$RUNNER_TEMP/ci-release.log"
          if grep -q "No access to secret variables" "$RUNNER_TEMP/ci-release.log"; then
            echo "::error::ci-release did not see the secrets - nothing was published"
            exit 1
          fi
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
