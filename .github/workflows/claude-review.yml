name: Claude Review

# Automatic code review for PRs targeting develop.
# Note: for `pull_request` events the workflow file is taken from the PR's base branch,
# so this works as soon as it is merged into develop (no need to be on master).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [develop]

jobs:
  claude-review:
    # skip drafts, PRs explicitly opting out via label, and PRs from forks
    # (fork PRs have no access to the token secret; skipping is cleaner than failing)
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'skip-claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request (use `gh pr diff` and `gh pr view` to inspect it).
            Focus on:
            - correctness bugs and error handling (ZIO effects, resource/connection handling)
            - concurrency issues (blocking calls on ZIO threads, thread pools, shared state)
            - Scala 3 idioms and consistency with the existing code style
            - missing or misleading tests

            Be concise: report only findings that matter, no praise, no summaries of the diff.
            Post your review as a single PR comment using `gh pr comment`.
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*)"'
