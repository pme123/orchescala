name: CI

on:
  pull_request:
  push:
    branches:
    - develop

permissions:
  contents: read
  checks: write

jobs:
  testAndGenerateDocs:
    runs-on: ubuntu-latest
    # a run takes about 7 minutes (more with a cold cache) - a hanging test fails the job instead of blocking it for 6 hours
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Coursier Cache
        uses: coursier/cache-action@v6
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 00-docs/package-lock.json
      - name: Build the documentation site
        # the markdown pages of 00-docs/src/docs - deployed to GitHub Pages from master (deploydocu.yml).
        # Before the sbt steps, so a broken page (link, include, image) shows up early.
        working-directory: 00-docs
        run: npm ci && npm run lint && npm test && npm run build
      - name: Build the DMN Tester UI
        # links the Scala.js output and lets vite bundle it to
        # 04-dmntester-client/dist/webapp - from where it is packaged into
        # orchescala-dmntester-server. Packaging/publishing does this by itself
        # (see build.sbt: bundleClient) - here it is an own step, so a broken UI
        # build is easy to spot.
        run: sbt dmnTesterClient/bundleClient
      - name: Build the documentation apps
        # vite builds orch-doc (site app + single-file API page), orch-spec and orch-ops to
        # 04-orch-doc/bundle - packaged into orchescala-orch-doc, which helper and gateway
        # ship. Same reason for an own step as above.
        run: sbt orchDocClient/bundleDocClient
      - name: Test the theme skill
        # .claude/skills/orch-theme-from-site/build_theme.py - plain Python 3, no packages; its colour
        # rules share colour-cases.json with orch-spec's tests, which bundleDocClient runs (above) - the
        # file is one of its inputs, so a change to it runs them again
        working-directory: .claude/skills/orch-theme-from-site
        run: python3 -m unittest -v test_build_theme
      - name: Compile
        run: sbt compile
      - name: Test
        # persistencePostgres/test runs against Postgres in Docker (Testcontainers) - on CI it fails
        # instead of being skipped when there is no Docker
        run: sbt -v "test:compile; domain/test; api/test; dmnTesterServer/test; worker/test; gateway/test; persistencePostgres/test"
        env:
          JAVA_OPTS: "-Dmunit.junitxml=true"
      - name: Check the company project templates
        # generates a company project with the company generator and compiles it like a
        # company build - its templates are only strings (see build.sbt: companyCheck)
        run: sbt companyCheck
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()    # run this step even if previous step failed
        with:
          name: Test Report            # Name of the check run which will be created
          path: "**/target/test-reports/*.xml"    # Path to test results
          reporter: java-junit        # Format of test results
        env:
          JAVA_OPTS: "-Xmx3G"

